get_sun_forecast:
  target:
    entity:
      integration: sunspots
      domain: binary_sensor
  fields:
    date:
      required: false
      selector:
        date:

refresh_buildings:
  target:
    entity:
      integration: sunspots
      domain: binary_sensor

set_building_height:
  target:
    entity:
      integration: sunspots
      domain: binary_sensor
  fields:
    latitude:
      required: true
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      required: true
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    height:
      required: true
      selector:
        number:
          min: 0.5
          max: 500
          step: 0.5
          unit_of_measurement: m
          mode: box

calibrate:
  target:
    entity:
      integration: sunspots
      domain: binary_sensor
  fields:
    observed:
      required: true
      selector:
        select:
          options:
            - sunny
            - shaded
          translation_key: observed
    at:
      required: false
      selector:
        datetime:

render_shadow_map:
  target:
    entity:
      integration: sunspots
      domain: binary_sensor
  fields:
    time:
      required: false
      selector:
        datetime:
