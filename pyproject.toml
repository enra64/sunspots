[project]
name = "sunspots"
version = "1.2.1"
description = "Home Assistant integration: is this outdoor spot in the sun?"
requires-python = ">=3.14"
license = "Apache-2.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # the formatter wraps code; long strings are fine

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/sunspots"]
ignore_missing_imports = true
follow_imports = "silent"  # only the integration itself is checked, not Home Assistant
